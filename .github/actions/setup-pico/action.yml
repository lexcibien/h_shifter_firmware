name: Set up Pico SDK
description: Set up Python, the Raspberry Pi Pico SDK, and optional Python build tools

inputs:
  pico-sdk-version:
    description: Raspberry Pi Pico SDK version
    required: false
    default: "2.3.0"
  python-version:
    description: Python version used by the build tools
    required: false
    default: "3.14"
  python-packages:
    description: Space-separated Python packages to install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Pico SDK and build tools
      uses: raspberrypi/pico-sdk-tools/installer@main
      with:
        sdk-version: ${{ inputs.pico-sdk-version }}
        sdk: true
        skip: riscv-toolchain,openocd

    - name: Install optional Python tools
      if: ${{ inputs.python-packages != '' }}
      shell: bash
      env:
        PYTHON_PACKAGES: ${{ inputs.python-packages }}
      run: python -m pip install $PYTHON_PACKAGES
