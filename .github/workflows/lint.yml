name: C/C++ quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev
    tags:
      - "*"
  workflow_dispatch:

jobs:
  format:
    name: Check C/C++ formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pico

      - name: Install formatting tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format ninja-build

      - name: Configure CMake
        run: cmake --preset waveshare_rp2040_zero_v1

      - name: Check formatting
        run: cmake --build --preset waveshare_rp2040_zero_v1 --target format-check

  lint:
    name: Lint C/C++ (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: V1
            preset: waveshare_rp2040_zero_v1
          - name: V2
            preset: waveshare_rp2040_zero_v2

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pico

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy ninja-build

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Run C/C++ analysis
        run: cmake --build --preset ${{ matrix.preset }} --target lint
