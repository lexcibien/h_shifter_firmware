name: Lint files cpp

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev
    tags:
      - "*"
  workflow_dispatch:

jobs:
  format_cpp:
    name: Check C/C++ formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install clang-format
        run: python -m pip install platformio clang-format==23.1.4
      - name: Check formatting
        run: platformio run --target format-check

  lint_cpp:
    name: Lint C/C++ (clang-tidy + cppcheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ${{ github.workspace }}/.pio/cache
            ${{ github.workspace }}/.pio/packages
          key: ${{ runner.os }}-pio-clang-tidy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Run C/C++ analysis
        run: platformio run --target lint
