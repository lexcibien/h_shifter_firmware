name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SHIFTER_PROJECT_V1
            preset: waveshare_rp2040_zero_v1
            log: "OFF"
          - name: SHIFTER_PROJECT_V1_LOGS
            preset: waveshare_rp2040_zero_v1
            log: "ON"
          - name: SHIFTER_PROJECT_V2
            preset: waveshare_rp2040_zero_v2
            log: "OFF"
          - name: SHIFTER_PROJECT_V2_LOGS
            preset: waveshare_rp2040_zero_v2
            log: "ON"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-pico

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }} -DH_SHIFTER_LOG=${{ matrix.log }}

      - name: Build firmware
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
