name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

jobs:
  compile_sketch:
    name: Build ${{ matrix.board.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        board:
          - { name: "SHIFTER_PROJECT_V1", env: "waveshare_rp2040_zero_v1" }
          - { name: "SHIFTER_PROJECT_V2", env: "waveshare_rp2040_zero_v2" }

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          submodules: recursive
          persist-credentials: true
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ${{ github.workspace }}/.pio/cache
            ${{ github.workspace }}/.pio/packages
            ${{ github.workspace }}/.pio/platforms
            ${{ github.workspace }}/.pio/buildcache
          key: ${{ runner.os }}-pio-${{ matrix.board.env }}-${{ hashFiles('platformio.ini', 'boards/**/*.ini', 'boards/**/*.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.board.env }}-
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Run Compile
        run: |
          platformio run -e ${{ matrix.board.env }}

      - name: List Files
        run: |
          echo "Current Directory:"
          pwd
          echo "Contents:"
          ls -R
