; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = Firmware para H-shifter (RP2040 Zero)
description = Firmware para o câmbio com RP2040 Zero, com projetos V1 de 12 botões e V2 de 13 botões virtuais.
default_envs =
  ; waveshare_rp2040_zero_v1
  waveshare_rp2040_zero_v2
build_cache_dir = .pio/buildcache
cache_dir = .pio/cache
platforms_dir = .pio/platforms
packages_dir = .pio/packages

extra_configs =
	boards/*.ini
	boards/*/*.ini

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git@1.20.0
framework = arduino
board_build.core = earlephilhower
board_build.arduino.earlephilhower.usb_manufacturer = Japatech Projects
build_type = release
build_unflags =	-std=gnu++17
build_flags =
	-std=gnu++23
	-fstack-usage
	-Wall
	-DUSE_TINYUSB
  -DTINYUSB_NEED_POLLING_TASK
  -DH_SHIFTER_DEBUG
  -DH_SHIFTER_LOG=1
  -Iinclude
  -DCFG_TUSB_CONFIG_FILE=\"h_shifter_tusb_config.h\"
extra_scripts =
  pre:scripts/compiledb.py
  scripts/targets.py
check_src_filters =
  +<src/>
check_skip_packages = yes
check_tool = cppcheck # Using clang-tidy installed because it's very old build with platformio
check_flags =
  cppcheck: --suppress=unusedFunction --suppress=*:${PROJECT_DIR}/.pio/libdeps/*
