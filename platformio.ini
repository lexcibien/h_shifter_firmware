; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = Firmware para H-shifter (RP2040 Zero)
description = Firmware para o câmbio com RP2040 Zero, lê 8 entradas do câmbio e apresenta 12 botões virtuais ao PC como Joystick.
default_envs =
	waveshare_rp2040_zero
build_cache_dir = .pio/buildcache
boards_dir = boards/json
cache_dir = .pio/cache
platforms_dir = .pio/platforms
packages_dir = .pio/packages
extra_configs =
	boards/*.ini
	boards/*/*.ini

[env]
framework = arduino
build_type = release
build_unflags =
	-std=gnu++17
build_flags =
	-std=gnu++23
	-fstack-usage
	-Wall
	-DDEBUG
	-DUSE_TINYUSB
extra_scripts =
	scripts/extra_script.py
check_tool = cppcheck, clangtidy
check_skip_packages = yes
check_flags =
	clangtidy: --config-file=.clang-tidy
	cppcheck: --suppress=unusedFunction
board_build.variants_dir = boards

[env:waveshare_rp2040_zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#v1.4.0-gcc14-arduinopico460
platform_packages = platformio/toolchain-atmelavr@^3.70300.220127
board = waveshare_rp2040_zero-custom
build_unflags =
	${env.build_unflags}
build_flags =
	${env.build_flags}
	-Iboards/waveshare_rp2040_zero
lib_deps =
  adafruit/Adafruit TinyUSB Library@^3.7.7
  adafruit/Adafruit NeoPixel
