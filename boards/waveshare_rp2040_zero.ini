[env:waveshare_rp2040_zero_v1]
board = waveshare_rp2040_zero
board_build.arduino.earlephilhower.usb_product = DAZ Shifter V1
build_unflags =	${env.build_unflags}
build_flags =
	${env.build_flags}
	-Iboards/waveshare_rp2040_zero
	-DSHIFTER_PROJECT_VERSION=SHIFTER_PROJECT_V1
lib_deps =
  adafruit/Adafruit TinyUSB Library@^3.7.7
  adafruit/Adafruit NeoPixel

[env:waveshare_rp2040_zero_v2]
board = waveshare_rp2040_zero
board_build.arduino.earlephilhower.usb_product = DAZ Shifter V2
build_unflags =	${env.build_unflags}
build_flags =
	${env.build_flags}
	-Iboards/waveshare_rp2040_zero
	-DSHIFTER_PROJECT_VERSION=SHIFTER_PROJECT_V2
lib_deps =
  adafruit/Adafruit TinyUSB Library@^3.7.7
  adafruit/Adafruit NeoPixel
